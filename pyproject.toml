# Configuração das ferramentas. As dependências ficam em requirements.txt e requirements-dev.txt.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["app"]

# Modo estrito nas camadas de regra (domínio e aplicação); padrão em api e infra,
# que conversam com bibliotecas de tipagem parcial (h3, shapely, httpx).
[[tool.mypy.overrides]]
module = ["app.dominio.*", "app.aplicacao.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes sem rede (P6): conexão para fora da máquina falha, exceto nos módulos marcados com
# enable_socket (os de contrato, que falam com o compose). A própria máquina fica liberada porque
# o laço de eventos do asyncio usa uma conexão local (decisão de 2026-10-27).
addopts = "--cov --cov-report=term-missing --allow-hosts=127.0.0.1,::1"

# Cobertura mínima de 90% medida só em domínio e aplicação.
[tool.coverage.run]
source = ["app/dominio", "app/aplicacao"]
branch = true

[tool.coverage.report]
fail_under = 90
